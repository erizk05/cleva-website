<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <filter id="shadow-family" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
    </filter>
    <linearGradient id="bodyGrad-family" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E1F2E6"/>
      <stop offset="60%" stop-color="#C5E8CE"/>
      <stop offset="100%" stop-color="#A7DAB5"/>
    </linearGradient>
    <linearGradient id="glassGrad-family" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b3a30"/>
      <stop offset="100%" stop-color="#0c1d18"/>
    </linearGradient>
    <pattern id="grid-family" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#d5e6db" stroke-width="0.75" stroke-dasharray="2,2"/>
    </pattern>
  </defs>

  <!-- Card Backdrop with Blueprint Grid -->
  <rect x="6" y="6" width="388" height="228" rx="12" fill="#F4F8F5" stroke="#D3E5D8" stroke-width="1.5"/>
  <rect x="6" y="6" width="388" height="228" rx="12" fill="url(#grid-family)" opacity="0.65"/>

  <!-- Dummy Watermark / Badge -->
  <g transform="translate(20, 24)">
    <rect width="96" height="22" rx="11" fill="#16382c" fill-opacity="0.08"/>
    <circle cx="12" cy="11" r="4" fill="#22c55e"/>
    <text x="22" y="15" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" font-weight="700" fill="#16382c" letter-spacing="1">DUMMY IMAGE</text>
  </g>

  <!-- Top Right Camera Placeholder Icon -->
  <g transform="translate(352, 20)" fill="none" stroke="#88a894" stroke-width="1.75">
    <rect x="0" y="4" width="26" height="18" rx="4"/>
    <circle cx="13" cy="13" r="5"/>
    <path d="M 6 4 L 9 0 L 17 0 L 20 4 Z"/>
  </g>

  <!-- Ground Shadows under wheels -->
  <ellipse cx="110" cy="192" rx="38" ry="7" fill="#A8D8B9" opacity="0.7" filter="url(#shadow-family)"/>
  <ellipse cx="290" cy="192" rx="38" ry="7" fill="#A8D8B9" opacity="0.7" filter="url(#shadow-family)"/>
  <ellipse cx="200" cy="190" rx="130" ry="6" fill="#0D1F1A" opacity="0.1" filter="url(#shadow-family)"/>

  <!-- Car Body Silhouette -->
  <path d="M 45 175 L 355 175 C 365 175 370 165 365 125 C 355 90 335 75 300 75 L 150 75 L 85 120 L 40 140 C 35 160 40 175 45 175 Z" fill="url(#bodyGrad-family)" stroke="#16382c" stroke-width="2" stroke-linejoin="round"/>

  <!-- Windows -->
  <path d="M 155 83 L 290 83 L 335 118 L 95 118 Z" fill="url(#glassGrad-family)" stroke="#16382c" stroke-width="1.5"/>

  <!-- Model Specific Detail (roof rails / utility bed / partition) -->
  <line x1="225" y1="83" x2="225" y2="118" stroke="#C5E8CE" stroke-width="1.5"/>

  <!-- Body Contour Line -->
  <path d="M 55 142 Q 200 132 355 142" fill="none" stroke="#16382c" stroke-width="1.2" opacity="0.5"/>

  <!-- Front Headlamp Glow & Rear Lamp -->
  <path d="M 40 142 L 55 145 L 48 152 Z" fill="#22c55e" opacity="0.85"/>
  <path d="M 365 138 L 355 140 L 358 148 Z" fill="#ef4444" opacity="0.85"/>

  <!-- Left Wheel (Front) -->
  <g transform="translate(110, 172)">
    <circle r="22" fill="#0D1F1A" stroke="#16382c" stroke-width="2"/>
    <circle r="14" fill="#C5E8CE" stroke="#16382c" stroke-width="1.5"/>
    <circle r="6" fill="#0D1F1A"/>
    <line x1="-14" y1="0" x2="14" y2="0" stroke="#16382c" stroke-width="1.5"/>
    <line x1="0" y1="-14" x2="0" y2="14" stroke="#16382c" stroke-width="1.5"/>
  </g>

  <!-- Right Wheel (Rear) -->
  <g transform="translate(290, 172)">
    <circle r="22" fill="#0D1F1A" stroke="#16382c" stroke-width="2"/>
    <circle r="14" fill="#C5E8CE" stroke="#16382c" stroke-width="1.5"/>
    <circle r="6" fill="#0D1F1A"/>
    <line x1="-14" y1="0" x2="14" y2="0" stroke="#16382c" stroke-width="1.5"/>
    <line x1="0" y1="-14" x2="0" y2="14" stroke="#16382c" stroke-width="1.5"/>
  </g>

  <!-- Model Name Watermark at bottom -->
  <text x="200" y="222" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#16382c" opacity="0.75" text-anchor="middle" letter-spacing="1.5">BEV CONCEPT</text>
</svg>