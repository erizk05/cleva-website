<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <filter id="shadow-cargo" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
    </filter>
    <linearGradient id="bodyGrad-cargo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E1F2E6"/>
      <stop offset="60%" stop-color="#C5E8CE"/>
      <stop offset="100%" stop-color="#A7DAB5"/>
    </linearGradient>
    <linearGradient id="glassGrad-cargo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b3a30"/>
      <stop offset="100%" stop-color="#0c1d18"/>
    </linearGradient>
    <pattern id="grid-cargo" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#d5e6db" stroke-width="0.75" stroke-dasharray="2,2"/>
    </pattern>
  </defs>

  <!-- Card Backdrop with Blueprint Grid -->
  <rect x="6" y="6" width="388" height="228" rx="12" fill="#F4F8F5" stroke="#D3E5D8" stroke-width="1.5"/>
  <rect x="6" y="6" width="388" height="228" rx="12" fill="url(#grid-cargo)" opacity="0.65"/>

  <!-- Dummy Watermark / Badge -->
  <g transform="translate(20, 24)">
    <rect width="108" height="22" rx="11" fill="#16382c" fill-opacity="0.08"/>
    <circle cx="12" cy="11" r="4" fill="#22c55e"/>
    <text x="22" y="15" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" font-weight="700" fill="#16382c" letter-spacing="1">DUMMY IMAGE</text>
  </g>

  <!-- Top Right Camera Placeholder Icon -->
  <g transform="translate(352, 20)" fill="none" stroke="#88a894" stroke-width="1.75">
    <rect x="0" y="4" width="26" height="18" rx="4"/>
    <circle cx="13" cy="13" r="5"/>
    <path d="M 6 4 L 9 0 L 17 0 L 20 4 Z"/>
  </g>

  <!-- Ground Shadows under wheels -->
  <ellipse cx="110" cy="192" rx="38" ry="7" fill="#A8D8B9" opacity="0.7" filter="url(#shadow-cargo)"/>
  <ellipse cx="290" cy="192" rx="38" ry="7" fill="#A8D8B9" opacity="0.7" filter="url(#shadow-cargo)"/>
  <ellipse cx="200" cy="190" rx="130" ry="6" fill="#0D1F1A" opacity="0.1" filter="url(#shadow-cargo)"/>

  <!-- Car Body Silhouette (4-Pax + Cargo Van/Truck) -->
  <path d="M 45 175 L 355 175 C 365 175 370 165 370 95 L 355 75 L 260 70 L 120 70 L 65 125 L 40 140 C 35 160 40 175 45 175 Z" fill="url(#bodyGrad-cargo)" stroke="#16382c" stroke-width="2" stroke-linejoin="round"/>

  <!-- Windows (Front & Mid row for 4 pax) -->
  <path d="M 125 78 L 185 78 L 185 115 L 75 115 Z" fill="url(#glassGrad-cargo)" stroke="#16382c" stroke-width="1.5"/>
  <path d="M 195 78 L 255 78 L 255 115 L 195 115 Z" fill="url(#glassGrad-cargo)" stroke="#16382c" stroke-width="1.5"/>

  <!-- Rear Cargo Bay Outline -->
  <rect x="268" y="80" width="92" height="90" fill="#d1e7d8" stroke="#16382c" stroke-dasharray="4,3" stroke-width="1.5" rx="3"/>
  <text x="314" y="125" font-family="sans-serif" font-size="10" font-weight="bold" fill="#16382c" text-anchor="middle" letter-spacing="1">CARGO BAY</text>
  <text x="314" y="140" font-family="sans-serif" font-size="8" fill="#16382c" text-anchor="middle" opacity="0.8">4-PAX CAB</text>

  <!-- Front & Rear Wheels -->
  <g transform="translate(110, 175)">
    <circle r="22" fill="#0D1F1A" stroke="#16382c" stroke-width="2"/>
    <circle r="12" fill="#C5E8CE" stroke="#16382c" stroke-width="1.5"/>
    <circle r="5" fill="#0D1F1A"/>
  </g>
  <g transform="translate(290, 175)">
    <circle r="22" fill="#0D1F1A" stroke="#16382c" stroke-width="2"/>
    <circle r="12" fill="#C5E8CE" stroke="#16382c" stroke-width="1.5"/>
    <circle r="5" fill="#0D1F1A"/>
  </g>

  <!-- Door Lines -->
  <line x1="120" y1="78" x2="115" y2="175" stroke="#16382c" stroke-width="1.2"/>
  <line x1="190" y1="78" x2="190" y2="175" stroke="#16382c" stroke-width="1.2"/>
  <line x1="262" y1="78" x2="262" y2="175" stroke="#16382c" stroke-width="1.2"/>

  <!-- Headlight & Tail Light -->
  <rect x="42" y="138" width="8" height="12" rx="3" fill="#ffe066" stroke="#16382c" stroke-width="1"/>
  <rect x="363" y="100" width="6" height="18" rx="2" fill="#ef4444" stroke="#16382c" stroke-width="1"/>
</svg>
